name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  commitlint:
    name: Commit Lint (PR commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: ahmadnassri/action-commit-lint@v2
        with:
          config: conventional

  test:
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          # Windows arm64 pas toujours utile (à toi de voir)
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BIN="go-server"
          if [ "$GOOS" = "windows" ]; then BIN="go-server.exe"; fi
          go build -trimpath -ldflags="-s -w" -o "dist/${BIN}-${GOOS}-${GOARCH}" ./cmd/api

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*